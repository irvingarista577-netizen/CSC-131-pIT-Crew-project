[build-system]
requires = ["setuptools >= 80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datascraper_CSC131_team7"
version = "0.0.1"
authors = [
  { name="Rhianna Nichols Thomae", email="rmnichols@csus.edu" },
]
description = "python project packaging test"
readme = "datascraper_README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/RMNSyntax/CSC-131-pIT-Crew-project/tree/main/datascraper%20files"
Issues = "https://github.com/RMNSyntax/CSC-131-pIT-Crew-project/issues"